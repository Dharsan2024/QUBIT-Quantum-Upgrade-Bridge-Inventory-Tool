name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-packages --group dev --extra ml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Type check workspace packages
        run: |
          for package in packages/qubit-*; do
            uv run mypy "$package/src"
          done
      - run: uv run pytest -m "not integration and not llm and not online"
      - if: matrix.python == '3.12'
        run: >-
          uv run pytest -m "not integration and not llm and not online"
          --cov --cov-report=xml --cov-fail-under=70
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Real-browser tests of the Report page. `tsc -b` and the bundle check cannot catch a component
      # that throws at mount, a `median(undefined)` printing NaN, or an export button that downloads
      # an empty file — only a browser can, so these run against a REAL API with a REAL scan rather
      # than mocked payloads. The spec skips itself when no API answers, so the API is started here
      # deliberately: a silently-skipping browser job would give false confidence.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Start the QUBIT API for the browser tests
        working-directory: .
        env:
          QUBIT_API_TOKEN: ci-browser-token-not-a-secret
        run: |
          uv sync --all-packages --group dev
          nohup uv run uvicorn qubit_api.main:app --host 127.0.0.1 --port 8000 >/tmp/qubit-api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null && exit 0
            sleep 2
          done
          echo "API never became healthy:"; cat /tmp/qubit-api.log; exit 1
      - name: Browser tests (dashboard Report page)
        env:
          QUBIT_API_BASE: http://127.0.0.1:8000
          QUBIT_API_TOKEN: ci-browser-token-not-a-secret
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: dashboard/test-results/
          retention-days: 7

  licenses:
    name: License allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --group dev --extra ml
      - run: >-
          uv run pip-licenses
          --partial-match
          --allow-only="MIT;Apache;BSD;ISC;MPL;PSF;Python Software Foundation;0BSD;Zlib;CC0"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
