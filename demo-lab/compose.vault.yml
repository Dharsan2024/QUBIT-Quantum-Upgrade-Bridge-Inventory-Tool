# HashiCorp Vault dev-mode demo service (backlog item B1) — additive, standalone. Does NOT touch
# compose.classical.yml / compose.hybrid.yml or the vulnapp-python/vulnapp-java demo-lab/SPEC.md
# contract; demoed separately from the core 4-phase narrative.
#
# Usage: docker compose -f demo-lab/compose.vault.yml up
# Then:  qubit scan-vault http://localhost:8200 --token qubit-demo-root-token
#
# Vault itself is BUSL-1.1 (not permissively open source) — running the official image is
# permitted under its Additional Use Grant (only competing hosted offerings are restricted); no
# Vault source is vendored here, only its publicly-documented HTTP API is used by the connector.
services:
  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: qubit-demo-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200 # so `vault status` (healthcheck) doesn't default to https
    networks:
      - qubit-vault-demo
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 2s
      retries: 20

  vault-seed:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: qubit-demo-root-token
      VAULT_DEV_ROOT_TOKEN_ID: qubit-demo-root-token
    entrypoint: ["/bin/sh", "/seed/vault-seed.sh"]
    volumes:
      - ./vault-seed.sh:/seed/vault-seed.sh:ro
    networks:
      - qubit-vault-demo

networks:
  qubit-vault-demo:
    driver: bridge
