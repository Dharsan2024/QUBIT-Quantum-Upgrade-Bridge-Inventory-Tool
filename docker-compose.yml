# QUBIT full-stack: API (FastAPI/uvicorn) + dashboard (static build served by nginx, which also
# reverse-proxies /api to the API container). `docker compose up` brings both up.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # SQLite on the writable named volume (Dockerfile sets the same default).
      - QUBIT_DB_URL=sqlite:////data/qubit.db
      # Dev bootstrap token; override in the shell/.env for anything real. While the api_tokens
      # table is empty this is honored as an implicit rw token (auth.py bootstrap).
      - QUBIT_API_TOKEN=${QUBIT_API_TOKEN:-dev_token}
    volumes:
      # Persist the DB only — do NOT mount over /app (that holds the installed app code).
      - qubit_data:/data
    # Not published to the host: the dashboard's nginx reverse-proxies to it on the compose network.
    expose:
      - "8000"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  qubit_data:
