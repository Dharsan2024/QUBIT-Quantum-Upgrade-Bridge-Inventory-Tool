version: "2026.08"
# Migration Knowledge Base — single source of truth for vulnerable-algorithm → PQC target mappings.
# Fields:
#   vuln:    {family: str, usage_context: str}   — matched case-insensitively against CryptoAsset
#   target:  {algorithm, mode, hybrid_group?, category, fips}
#   library: {python: {name, min_version}, java: {name, min_version}}
#   guidance: str  — human-readable migration note
#
# Order matters: more specific entries should appear first.
# Hash of this file is recorded in the migration engine-version record (reproducibility, N8).

entries:
  - vuln:
      family: RSA
      usage_context: kex
    target:
      algorithm: ML-KEM-768
      mode: hybrid
      hybrid_group: X25519MLKEM768
      parameter_set: ML-KEM-768
      category: 3
      fips: FIPS-203
    library:
      python:
        name: cryptography
        min_version: "49"
      java:
        name: bouncycastle
        min_version: "1.79"
    guidance: >
      RSA key transport is Shor-breakable and HNDL-exposed. Replace with an ML-KEM-768
      KEM-DEM pattern (hybrid X25519+ML-KEM-768 during the transition). Use
      `cryptography>=49` (`mlkem.MLKEM768PrivateKey.generate()`). Existing RSA ciphertexts
      must be re-encrypted. Do NOT inject liboqs-python into target repos (offline-sandbox break).

  - vuln:
      family: RSA
      usage_context: signature
    target:
      algorithm: ML-DSA-65
      mode: pure
      parameter_set: ML-DSA-65
      category: 3
      fips: FIPS-204
    library:
      python:
        name: cryptography
        min_version: "49"
      java:
        name: bouncycastle
        min_version: "1.84"
    guidance: >
      RSA signatures are Shor-breakable. Replace with ML-DSA-65 (FIPS-204, CRYSTALS-Dilithium
      level-3). No mainstream JOSE library registers an ML-DSA algorithm identifier in 2026 —
      patch the signing primitive, not the JOSE layer.

  - vuln:
      family: RSA
      usage_context: encryption-at-rest
    target:
      algorithm: ML-KEM-768
      mode: hybrid
      hybrid_group: X25519MLKEM768
      parameter_set: ML-KEM-768
      category: 3
      fips: FIPS-203
    library:
      python:
        name: cryptography
        min_version: "49"
      java:
        name: bouncycastle
        min_version: "1.79"
    guidance: >
      RSA encryption-at-rest is Shor-breakable and HNDL-exposed. Migrate to ML-KEM-768 KEM-DEM
      (hybrid X25519+ML-KEM-768). Requires re-encryption of all stored ciphertext.

  - vuln:
      family: ECDSA
      usage_context: signature
    target:
      algorithm: ML-DSA-65
      mode: pure
      parameter_set: ML-DSA-65
      category: 3
      fips: FIPS-204
    library:
      python:
        name: cryptography
        min_version: "49"
      java:
        name: bouncycastle
        min_version: "1.84"
    guidance: >
      ECDSA is Shor-breakable. Replace with ML-DSA-65 (FIPS-204, category-3 security).
      No mainstream JOSE library registers an ML-DSA alg in 2026 — patch the signing
      primitive layer.

  - vuln:
      family: RSA
      usage_context: token
    target:
      algorithm: ML-DSA-65
      mode: pure
      parameter_set: ML-DSA-65
      category: 3
      fips: FIPS-204
    library:
      python:
        name: cryptography
        min_version: "49"
      java:
        name: bouncycastle
        min_version: "1.84"
    guidance: >
      RS256/RS384/RS512/PS256/PS384/PS512 (RSA-family JWT/JOSE signing) are Shor-breakable.
      No mainstream JOSE library registers an ML-DSA `alg` identifier in 2026 — patch the
      underlying signing primitive/key, not the JOSE layer, and rotate any long-lived tokens
      signed under the old key.

  - vuln:
      family: ECDSA
      usage_context: token
    target:
      algorithm: ML-DSA-65
      mode: pure
      parameter_set: ML-DSA-65
      category: 3
      fips: FIPS-204
    library:
      python:
        name: cryptography
        min_version: "49"
      java:
        name: bouncycastle
        min_version: "1.84"
    guidance: >
      ES256/ES384/ES512 (ECDSA-family JWT/JOSE signing) are Shor-breakable. No mainstream JOSE
      library registers an ML-DSA `alg` identifier in 2026 — patch the underlying signing
      primitive/key, not the JOSE layer, and rotate any long-lived tokens signed under the old key.

  - vuln:
      family: HMAC
      usage_context: token
    target:
      algorithm: HS384
      mode: pure
      parameter_set: HS384
      category: 1
      fips: FIPS-198-1
    library:
      python:
        name: cryptography
        min_version: "38"
      java:
        name: bouncycastle
        min_version: "1.70"
    guidance: >
      HS256/HS384/HS512 (HMAC-family JWT/JOSE signing) are symmetric-keyed and only
      Grover-weakened, not Shor-broken. This is a key-length upgrade (prefer HS384/HS512 over
      HS256), not a KEM or signature-scheme replacement.

  - vuln:
      family: ECDH
      usage_context: kex
    target:
      algorithm: ML-KEM-768
      mode: hybrid
      hybrid_group: X25519MLKEM768
      parameter_set: ML-KEM-768
      category: 3
      fips: FIPS-203
    library:
      python:
        name: cryptography
        min_version: "49"
      java:
        name: bouncycastle
        min_version: "1.79"
    guidance: >
      ECDH key exchange is Shor-breakable and HNDL-exposed. Adopt X25519MLKEM768 (hybrid
      X25519 + ML-KEM-768) during the PQC transition; pure ML-KEM-768 when X.509 / PKI
      support catches up.

  - vuln:
      family: AES
      usage_context: encryption-at-rest
    target:
      algorithm: AES-256
      mode: pure
      parameter_set: AES-256
      category: 1
      fips: FIPS-197
    library:
      python:
        name: cryptography
        min_version: "38"
      java:
        name: bouncycastle
        min_version: "1.70"
    guidance: >
      Grover's algorithm halves the effective key length of AES: AES-128 → 64-bit post-quantum
      security. Upgrade to AES-256 (128-bit post-quantum security, FIPS-197). This is a
      symmetric key-length upgrade, not a KEM change; no re-encryption beyond key rotation.

  - vuln:
      family: SHA-1
      usage_context: hash
    target:
      algorithm: SHA3-256
      mode: pure
      parameter_set: SHA3-256
      category: 2
      fips: FIPS-202
    library:
      python:
        name: cryptography
        min_version: "38"
      java:
        name: bouncycastle
        min_version: "1.70"
    guidance: >
      SHA-1 is classically broken (collision attacks) and Grover-weakened. Replace with
      SHA3-256 (FIPS-202, 128-bit post-quantum collision resistance). SHA-256 is acceptable
      if SHA-3 cannot be adopted (256-bit output → 128-bit Grover resistance).

  - vuln:
      family: MD5
      usage_context: hash
    target:
      algorithm: SHA3-256
      mode: pure
      parameter_set: SHA3-256
      category: 2
      fips: FIPS-202
    library:
      python:
        name: cryptography
        min_version: "38"
      java:
        name: bouncycastle
        min_version: "1.70"
    guidance: >
      MD5 is classically broken (collision + pre-image attacks) and provides negligible
      post-quantum security. Replace with SHA3-256 (FIPS-202) immediately.

# ---------------------------------------------------------------------------
# Wire-format and storage impact of each PQC target.
# ---------------------------------------------------------------------------
# WHY THIS EXISTS. A PQC migration is not a token swap, and treating it as one is how a migration
# compiles, passes review, and then fails in production. ML-DSA-65 signatures are 3309 bytes where
# RSA-2048 gave 256 and Ed25519 gave 64 — so a `VARCHAR(256)` signature column, a `[64]byte` array,
# a `uint16` length prefix and a 4 KB session cookie are all broken by a patch that looks perfectly
# correct at the call site. None of that is visible from the line the scanner flagged, which is
# exactly why it gets missed by hand too.
#
# These facts are rendered into the generator prompt (`transform/llm._impact_block`) so the model is
# asked for a COMPLETE migration — the primitive swap plus its storage, framing and compatibility
# consequences — rather than a one-line substitution.
#
# Sizes are from the FIPS 203 and FIPS 204 parameter tables. Classical baselines are definitional
# rather than looked up: an RSA signature is exactly the modulus length (2048/8 = 256 bytes), an
# ECDSA P-256 raw signature is r||s = 2x32 = 64 bytes, and Ed25519 is 64 bytes per RFC 8032 §5.1.6.
artifact_impact:
  ML-KEM-768:
    fips: FIPS-203
    kind: kem
    sizes:
      encapsulation_key: 1184
      decapsulation_key: 2400
      ciphertext: 1088
      shared_secret: 32
    replaces:
      RSA-2048: "256-byte ciphertext, ~294-byte SPKI public key"
      X25519: "32-byte public key, 32-byte shared secret"
    breaks:
      - >
        ML-KEM is a KEM, NOT a cipher. There is no `mlkem.encrypt(plaintext)`. Code that called
        `rsa.encrypt(data)` or `PKCS1_OAEP.encrypt(data)` must be RESTRUCTURED into KEM-DEM:
        encapsulate to obtain a 32-byte shared secret, derive a data key from it, then encrypt the
        payload with AES-256-GCM or ChaCha20-Poly1305. A patch that swaps the call name and keeps a
        single encrypt(plaintext) shape is wrong and will not run.
      - >
        Wrapped-key storage grows from 256 to 1088 bytes plus the DEM ciphertext. Any column, fixed
        buffer or length field sized for an RSA-wrapped key must widen.
      - >
        Data already encrypted to an RSA public key cannot be read with an ML-KEM key. The
        transition needs a dual path — unwrap with the old RSA key, re-wrap with ML-KEM. That is a
        data migration, not a code change, and it must be called out rather than silently skipped.
  ML-DSA-65:
    fips: FIPS-204
    kind: signature
    sizes:
      public_key: 1952
      private_key: 4032
      signature: 3309
    replaces:
      RSA-2048: "256-byte signature, ~294-byte SPKI public key"
      ECDSA-P256: "64-byte raw signature (~70-72 DER), 65-byte uncompressed public key"
      Ed25519: "64-byte signature, 32-byte public key"
    breaks:
      - >
        The signature grows to 3309 bytes — 13x RSA-2048 and 52x Ed25519. Every fixed-width store
        breaks: `VARCHAR(256)`/`VARCHAR(512)`/`BINARY(64)` signature columns, `[64]byte` and
        `[256]byte` arrays, and any length prefix narrower than 16 bits. Widen them in the same
        patch, and name what must change where the consequence lives outside this file.
      - >
        Base64 of a 3309-byte signature is 4412 characters, so a JWT/JWS signed with ML-DSA-65 no
        longer fits in a 4 KB cookie or a default 4-8 KB HTTP header budget. A token carried in a
        cookie must move to a request body or a server-side session.
      - >
        The public key grows to 1952 bytes, changing certificate, keystore, JWK and pinned-key
        sizes.
      - >
        Signatures already issued under RSA or ECDSA cannot be verified with an ML-DSA key. Keep
        the old VERIFY path alive alongside the new one until every outstanding signature has
        expired — remove the old SIGNING path immediately, but not the old verify path.
