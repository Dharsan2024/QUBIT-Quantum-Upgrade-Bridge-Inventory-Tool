id: cfg-ssh-01
language: sshd_config
title: "Weak OpenSSH algorithms → PQC-hybrid key exchange with AEAD ciphers"
matches:
  # Config-scanner assets ONLY. These algorithm names also occur in application code, and
  # without this the config codemod would be pointed at a source file it cannot edit.
  source_scanner: [config]
  # OpenSSH config filenames. `source_scanner: [config]` is not enough on its own: the dependency
  # scanner reports manifests as `config` too, so without this an ECDSA-P256 pin in
  # requirements.txt was claimed here and the sshd codemod was pointed at a pip manifest.
  file_name: ["sshd_config", "ssh_config", "sshd_config.*", "*.sshd_config"]
  algorithm:
    ["ssh-rsa", "ssh-dss", "DH-1024-group1", "DH-2048-group14", "HMAC-SHA1", "HMAC-MD5",
     "3DES", "AES-128", "RC4", "ECDSA-P256",
     # The ECDH curves an sshd_config names in KexAlgorithms. These are exactly the directives
     # `harden_ssh` rewrites to sntrup761x25519-sha512, but only ECDSA-P256 (a HOST KEY algorithm)
     # was listed, so the key-exchange findings this rule exists to fix matched nothing.
     "ECDH-P256", "ECDH-P384", "ECDH-P521", "X25519",
     # Host-key and KEX names the scanner reports verbatim from the directive. Measured on the
     # corpus: `rsa-sha2` host-key findings and `DH-4096-group16` KEX findings matched no rule at
     # all, in the very file this rule's codemod already knows how to harden.
     "rsa-sha2", "rsa-sha2-256", "rsa-sha2-512", "ssh-ed25519", "Ed25519", "Ed448",
     "DH-4096-group16",
     "ECDSA-P384", "ECDSA-P521", "HMAC-SHA2-256", "HMAC-SHA2-512"]
  usage_context: ["kex", "signature", "token", "encryption-at-rest"]
  library_name: [null]
target:
  algorithm: sntrup761x25519-sha512
  mode: hybrid
  hybrid_group: sntrup761x25519-sha512
  category: 3
  fips: none
data_compat: in_place
semantic_note: >
  OpenSSH's sntrup761x25519-sha512 is a post-quantum hybrid key exchange (default since OpenSSH 9.x),
  so this is the SSH equivalent of adding X25519MLKEM768 to a TLS terminator - it protects recorded
  SSH sessions against harvest-now-decrypt-later immediately. Ciphers are reduced to AEAD
  (aes256-gcm, chacha20-poly1305), MACs to encrypt-then-MAC SHA-2, and host keys to Ed25519 plus
  rsa-sha2-* - dropping ssh-rsa, which is RSA with a SHA-1 signature and deprecated by OpenSSH 8.8+
  for that reason. Nothing stored is re-encrypted, so this takes effect on the next connection.

  A deliberate choice with a known gap, recorded rather than glossed. `sntrup761` is **NTRU Prime**,
  not ML-KEM: it is not a NIST-standardised algorithm, and it is here because it is what shipped
  OpenSSH actually negotiates. BSI TR-02102-4 Version 2026-01 section 3.1.3 names two different
  algorithms it intends to recommend once the RFC is adopted - `mlkem768nistp256-sha256` and
  `mlkem1024nistp384-sha384`, from draft-ietf-sshm-mlkem-hybrid-kex - and recommends classical SSH
  key exchange only "bis Ende 2031".

  So this patch produces a hybrid that is post-quantum and deployable today, on a KEM that is not
  the one the standards track is heading for. Emitting BSI's named pair instead would produce a
  config no shipped server can negotiate, which is a worse failure than being off-track: it would
  not survive the apply stage, let alone the rescan. The right answer changes when OpenSSH ships
  the RFC algorithms, and until then the honest description of this rule's output is
  "post-quantum, deployable, and not yet standards-aligned".
codemod: harden_tls_config
# The correct output here is a constant (the hybrid group / the version floor), so the codemod is
# authoritative and an LLM must not replace it even under --generator llm.
codemod_authoritative: true
prompt_constraints:
  - "KexAlgorithms must list sntrup761x25519-sha512@openssh.com first."
  - "Do not remove all host-key algorithms; keep ssh-ed25519 and rsa-sha2-512 so logins still work."
example:
  before: |
    Ciphers aes128-cbc,3des-cbc
    MACs hmac-sha1
    KexAlgorithms diffie-hellman-group1-sha1
    HostKeyAlgorithms ssh-rsa
  after: |
    Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com,aes256-ctr
    MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
    KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256
    HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256
rescan_expect:
  gone:
    algorithm_prefix: ["ssh-rsa", "ssh-dss", "DH-1024-group1", "HMAC-SHA1", "3DES"]
