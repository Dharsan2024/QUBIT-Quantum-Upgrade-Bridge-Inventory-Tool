id: cfg-tls-01
language: nginx
title: "Deprecated TLS/SSL configuration → TLS 1.2+1.3 with hybrid post-quantum key exchange"
matches:
  # Config-scanner assets ONLY. These algorithm names also occur in application code, and
  # without this the config codemod would be pointed at a source file it cannot edit.
  source_scanner: [config]
  # Web-server config filenames — see cfg-ssh-01 on why source_scanner alone is insufficient.
  #
  # `*.conf` is deliberate rather than a fixed allowlist. Real deployments do not name their vhosts
  # `nginx.conf`: measured on the 21-app demo corpus, 14 of 113 unmatched findings were nginx
  # configs called `edge.conf`, `mgmt-vhost.conf` and `nginx-classical.conf`, each reported as
  # "no migration rule" purely because of its filename. `harden_config_file` dispatches on file
  # CONTENT (an Apache directive regex, else nginx), so a `.conf` that is neither simply produces
  # no change and the task is parked as "nothing left to change" — an honest outcome, not a crash.
  # The dependency scanner also reports manifests as `config`, which is what `library_name: [null]`
  # below excludes; a manifest has a library name and a vhost does not.
  file_name: ["*.conf", "*.vhost", "nginx.conf", "httpd.conf", "apache2.conf"]
  # Detections from the config scanner (nginx/Apache CFG-*-PROTO/CIPHERS rules) and from the C
  # OpenSSL legacy-method rule all normalize to these protocol identities.
  algorithm:
    ["TLSv1.0", "TLSv1.1", "SSLv3", "SSLv2", "RSA", "DH", "ECDH-P256", "AES-128", "3DES", "RC4",
    # The other curve names an `ssl_ecdh_curve` / `SSLECDHCurve` directive can carry. `ECDH-P256`
    # was listed but `X25519` was not, so a vhost already modernised to X25519 — still entirely
    # classical, and exactly what this codemod exists to make hybrid — matched no rule at all.
    "X25519", "X448", "ECDH-P384", "ECDH-P521", "DH-2048", "DH-4096"]
  # `kex` covers the ssl_ecdh_curve / SSLECDHCurve group findings, which are the very directives this
  # rule rewrites to X25519MLKEM768 — without it the most important asset it fixes did not match it.
  usage_context: ["tls", "kex"]
  library_name: [null]
target:
  algorithm: X25519MLKEM768
  mode: hybrid
  hybrid_group: X25519MLKEM768
  category: 3
  fips: FIPS-203
# in_place is genuinely true here, unlike for application-code cipher swaps: changing a TLS
# directive only affects what the NEXT handshake negotiates. No stored data is re-encrypted, so
# there is nothing to migrate and no dual-read window.
data_compat: in_place
semantic_note: >
  This is the change that actually makes a deployment quantum-safe today. Rewriting application
  code to ML-KEM protects only the data that code encrypts; adding X25519MLKEM768 to the TLS
  terminator makes every session the service negotiates hybrid post-quantum immediately, for all
  traffic, with classical fallbacks retained so older clients keep working. Deprecated protocol
  versions (SSLv2/SSLv3/TLS 1.0/1.1) are removed, cipher suites are reduced to AEAD-only
  forward-secret ones (no CBC padding oracles, no RSA key transport - the worst case for
  harvest-now-decrypt-later, since it has no forward secrecy at all), and TLS 1.2 is deliberately
  retained alongside 1.3 because dropping it outright would make the patch un-appliable in practice.
  Requires the terminator to be linked against OpenSSL 3.5+, which ships ML-KEM natively.
codemod: harden_tls_config
# The correct output here is a constant (the hybrid group / the version floor), so the codemod is
# authoritative and an LLM must not replace it even under --generator llm.
codemod_authoritative: true
prompt_constraints:
  - "Never remove TLSv1.2; removing it breaks clients and the patch will be rejected."
  - "ssl_ecdh_curve/Curves must list X25519MLKEM768 first, then classical fallbacks."
example:
  before: |
    server {
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        ssl_ciphers HIGH:!aNULL:!MD5;
    }
  after: |
    server {
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519:secp256r1;
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    }
rescan_expect:
  gone:
    algorithm_prefix: ["TLSv1.0", "TLSv1.1", "SSLv3", "SSLv2"]
