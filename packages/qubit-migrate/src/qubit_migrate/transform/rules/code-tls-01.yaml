id: code-tls-01
language: multi
title: "Deprecated TLS/SSL version pinned in source → TLS 1.2 minimum, prefer 1.3"
matches:
  source_scanner: [code]
  # cfg-tls-01 handles nginx/Apache CONFIG. This is the same weakness expressed in SOURCE — an
  # SSLContext, a tls.Config, an SSL_CTX_new(TLSv1_method()) — which no rule reached, so a service
  # hard-pinned to TLS 1.0 in code had no migration path at all.
  file_suffix:
    [".py", ".go", ".java", ".js", ".mjs", ".cjs", ".ts", ".tsx", ".c", ".h", ".cc", ".cpp",
    ".hpp", ".cs", ".php", ".rb", ".rs", ".kt", ".kts", ".scala", ".swift", ".dart", ".sh",
    ".bash", ".ps1", ".psm1", ".sql"]
  algorithm: ["SSLv2", "SSLv3", "TLSv1.0", "TLSv1.1"]
  usage_context: ["tls", "unknown"]
  library_name: [null]
target:
  algorithm: TLSv1.3
  mode: hybrid
  hybrid_group: X25519MLKEM768
  category: 3
semantic_note: >
  SSLv2, SSLv3, TLS 1.0 and TLS 1.1 are deprecated and carry classically broken constructions
  (BEAST, POODLE, SHA-1 signatures, no AEAD requirement). Raise the MINIMUM version to TLS 1.2 and
  prefer TLS 1.3. Set a minimum rather than pinning a single exact version: a hard pin to TLS 1.3
  breaks any peer that has not migrated yet, and pinning is what produced this finding in the first
  place. TLS 1.3 is also the only version that can negotiate a hybrid post-quantum group such as
  X25519MLKEM768, so this change is a prerequisite for post-quantum key exchange on the wire - but it
  does not by itself deliver it: the group must be enabled too, and that needs OpenSSL 3.5+ or an
  equivalent. Nothing stored changes, so this takes effect on the next handshake.
data_compat: in_place
prompt_constraints:
  - "Set a MINIMUM version, not an exact one: Go tls.Config{MinVersion: tls.VersionTLS12}, Python ssl.SSLContext.minimum_version = ssl.TLSVersion.TLSv1_2."
  - "Python: use ssl.create_default_context() rather than ssl.SSLContext(ssl.PROTOCOL_TLSv1); never PROTOCOL_SSLv23 with no minimum set."
  - "Java: SSLContext.getInstance(\"TLS\") plus setEnabledProtocols(new String[]{\"TLSv1.3\", \"TLSv1.2\"}) — never getInstance(\"TLSv1\")."
  - "C/OpenSSL: use TLS_method() with SSL_CTX_set_min_proto_version(ctx, TLS1_2_VERSION); never TLSv1_method() or SSLv3_method()."
  - "Do not disable certificate or hostname verification while changing the version."
  - "Never remove TLS 1.2 support — dropping it breaks peers and makes the patch unusable."
example:
  before: |
    import ssl

    ctx = ssl.SSLContext(ssl.PROTOCOL_TLSv1)
    ctx.set_ciphers("DEFAULT")
  after: |
    import ssl

    # A default context verifies certificates and hostnames; the minimum is raised rather than pinned
    # so TLS 1.3 is used whenever the peer supports it.
    ctx = ssl.create_default_context()
    ctx.minimum_version = ssl.TLSVersion.TLSv1_2
example_go:
  before: |
    cfg := &tls.Config{
        MinVersion: tls.VersionTLS10,
    }
  after: |
    cfg := &tls.Config{
        // TLS 1.3 is negotiated when the peer supports it; 1.2 stays available for those that do not.
        MinVersion: tls.VersionTLS12,
    }
example_java:
  before: |
    SSLContext ctx = SSLContext.getInstance("TLSv1");
    ctx.init(null, null, null);
  after: |
    SSLContext ctx = SSLContext.getInstance("TLS");
    ctx.init(null, null, null);
    SSLSocket socket = (SSLSocket) ctx.getSocketFactory().createSocket(host, port);
    socket.setEnabledProtocols(new String[] {"TLSv1.3", "TLSv1.2"});
example_c:
  before: |
    SSL_CTX *ctx = SSL_CTX_new(TLSv1_method());
  after: |
    /* TLS_method() negotiates the best mutually supported version; the floor is set explicitly. */
    SSL_CTX *ctx = SSL_CTX_new(TLS_method());
    SSL_CTX_set_min_proto_version(ctx, TLS1_2_VERSION);
    /* With OpenSSL 3.5+, enable a hybrid post-quantum group for the key exchange: */
    SSL_CTX_set1_groups_list(ctx, "X25519MLKEM768:X25519:P-256");
rescan_expect:
  gone:
    algorithm_prefix: ["SSLv2", "SSLv3", "TLSv1.0", "TLSv1.1"]
