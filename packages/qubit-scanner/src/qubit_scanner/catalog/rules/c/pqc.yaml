# Post-quantum APIs in C, via liboqs (the Open Quantum Safe library).
#
# Quantum-SAFE findings. They are inventoried for the same two reasons as the JS/TS pack: a codebase
# that has already adopted ML-KEM should be credited for it instead of appearing to have no PQC at
# all, and the migration validator's stage-5 rescan asserts `present: ML-KEM` / `ML-DSA` on the
# patched file — with no rule to detect liboqs, a correct C rewrite could never be confirmed and the
# patch was thrown away.
#
# The algorithm is carried by liboqs' `OQS_KEM_alg_*` / `OQS_SIG_alg_*` identifier passed to the
# constructor, which is what these rules capture.
schema: qubit-rule/v1
language: c
# Same queries also compiled against the cpp grammar:
# OpenSSL's C API is used from C++ verbatim; every query here matches a C++ TU.
additional_languages: [cpp]
library:
  name: liboqs
  # resolve.py has no C import-extraction query, and the OQS_* symbols are unmistakable on
  # their own, so an import gate would only ever disable these rules.
  detect_imports: []
rules:
  - id: C-LIBOQS-KEM
    title: "liboqs OQS_KEM_new(...) — post-quantum KEM"
    match:
      query: |
        (call_expression
          function: (identifier) @fn
          arguments: (argument_list (identifier) @alg)) @call
      where:
        - { capture: fn, equals: OQS_KEM_new }
    extract:
      algorithm: { from: alg, resolve: liboqs-alg-const }
    asset: { asset_type: algorithm-use, usage_context: kex }
    confidence: high
    examples:
      positive:
        - |
          #include <oqs/oqs.h>
          void f(void) {
              OQS_KEM *kem = OQS_KEM_new(OQS_KEM_alg_ml_kem_768);
              OQS_KEM_free(kem);
          }
        - |
          #include <oqs/oqs.h>
          void g(void) {
              OQS_KEM *kem = OQS_KEM_new(OQS_KEM_alg_kyber_1024);
              OQS_KEM_free(kem);
          }
      negative:
        - |
          #include <openssl/evp.h>
          void f(void) { EVP_MD_CTX *c = EVP_MD_CTX_new(); EVP_MD_CTX_free(c); }

  - id: C-LIBOQS-SIG
    title: "liboqs OQS_SIG_new(...) — post-quantum signature"
    match:
      query: |
        (call_expression
          function: (identifier) @fn
          arguments: (argument_list (identifier) @alg)) @call
      where:
        - { capture: fn, equals: OQS_SIG_new }
    extract:
      algorithm: { from: alg, resolve: liboqs-alg-const }
    asset: { asset_type: algorithm-use, usage_context: signature }
    confidence: high
    examples:
      positive:
        - |
          #include <oqs/oqs.h>
          void f(void) {
              OQS_SIG *sig = OQS_SIG_new(OQS_SIG_alg_ml_dsa_65);
              OQS_SIG_free(sig);
          }
        - |
          #include <oqs/oqs.h>
          void h(void) {
              OQS_SIG *sig = OQS_SIG_new(OQS_SIG_alg_sphincs_sha2_128f_simple);
              OQS_SIG_free(sig);
          }
      negative:
        - |
          #include <openssl/evp.h>
          void f(void) { EVP_PKEY *k = EVP_RSA_gen(2048); EVP_PKEY_free(k); }

  # Found by benchmarks/oracles on open-quantum-safe/oqs-provider, where QUBIT reported 24 sites and
  # every one of them was RUNTIME-SELECTED while pqaudit and cryptoscan both named ML-KEM, ML-DSA
  # and SLH-DSA. Neither of them was wrong.
  #
  # The two rules above anchor on `OQS_KEM_new(...)` / `OQS_SIG_new(...)`, and in a real liboqs
  # consumer that call takes a VARIABLE — `OQS_KEM_new(oqs_name)` — so RUNTIME-SELECTED is the
  # honest answer for it. The algorithm names are still right there in the file, in the provider's
  # registration table:
  #
  #     {0, "mlkem768", OQS_KEM_alg_ml_kem_768, KEY_TYPE_KEM, 192, 0},
  #
  # A constant naming an algorithm is evidence of that algorithm wherever it appears, which is
  # exactly the conclusion the JWA identifier rules reached for Go/Python/JS/TS. Anchoring detection
  # on the call site alone meant the reference implementation of post-quantum cryptography for
  # OpenSSL registered as having no identifiable post-quantum cryptography in it.
  #
  # `dedupe: per-file` because a registration table names the same algorithm on many lines, and an
  # inventory listing ML-KEM-768 twelve times is a worse inventory, not a more complete one.
  - id: C-LIBOQS-ALG-CONST
    title: "liboqs algorithm constant — OQS_KEM_alg_ml_kem_768 / OQS_SIG_alg_ml_dsa_44"
    match:
      query: |
        (identifier) @alg
      where:
        - { capture: alg, regex: "^OQS_(KEM|SIG)_alg_[A-Za-z0-9_]+$" }
    extract:
      algorithm: { from: alg, resolve: liboqs-alg-const }
    # `unknown` rather than kex or signature: this is a registration, and the same table lists both
    # KEMs and signatures. Claiming a usage context the constant does not carry would put a
    # confident wrong answer where an honest one belongs.
    asset: { asset_type: algorithm-use, usage_context: unknown }
    confidence: high
    dedupe: per-file
    examples:
      positive:
        - |
          #include <oqs/oqs.h>
          static const struct { const char *name; const char *alg; } table[] = {
              {"mlkem768", OQS_KEM_alg_ml_kem_768},
          };
        - |
          #include <oqs/oqs.h>
          static const char *sigs[] = {OQS_SIG_alg_ml_dsa_44, OQS_SIG_alg_falcon_512};
      negative:
        - |
          #include <oqs/oqs.h>
          void f(void) { OQS_KEM *kem = OQS_KEM_new(oqs_name); OQS_KEM_free(kem); }
