schema: qubit-rule/v1
language: java
library:
  name: Java JCA/JSSE
  detect_imports: [java, javax, org]
rules:
  # Transport posture, key stores, signatures and the remaining JCE ciphers. `SSLContext.getInstance`
  # is where a Java service pins its TLS version, and it had no rule.
  - id: JAVA-JSSE-SSLCONTEXT-LEGACY
    title: SSLContext.getInstance("SSLv3"/"TLSv1"/"TLSv1.1") — deprecated protocol
    match:
      query: |
        (method_invocation
          object: (identifier) @obj
          name: (identifier) @meth
          arguments: (argument_list (string_literal) @proto)) @call
      where:
        - { capture: obj, in: [SSLContext, SSLSocketFactory] }
        - { capture: meth, equals: getInstance }
        - { capture: proto, regex: '^"(SSL|SSLv2|SSLv3|TLSv1|TLSv1\.1)"$' }
    extract:
      algorithm: { from: proto, resolve: string-literal }
    asset: { asset_type: protocol, usage_context: tls }
    confidence: high
    examples:
      positive:
        - |
          import javax.net.ssl.SSLContext;
          class A { void f() throws Exception { SSLContext.getInstance("TLSv1"); } }
        - |
          import javax.net.ssl.SSLContext;
          class A { void f() throws Exception { SSLContext.getInstance("SSLv3"); } }
      negative:
        - |
          import javax.net.ssl.SSLContext;
          class A { void f() throws Exception { SSLContext.getInstance("TLSv1.3"); } }

  - id: JAVA-JCA-SIGNATURE
    title: Signature.getInstance(<alg>)
    match:
      query: |
        (method_invocation
          object: (identifier) @obj
          name: (identifier) @meth
          arguments: (argument_list (string_literal) @algo)) @call
      where:
        - { capture: obj, equals: Signature }
        - { capture: meth, equals: getInstance }
    extract:
      # "SHA256withRSA" / "SHA1withDSA" / "Ed25519" / "SHA256withECDSA". `jca-signature` splits on
      # "with" and reports the KEY algorithm, which is the Shor-relevant half — the digest is
      # inventoried separately by the MessageDigest rules.
      algorithm: { from: algo, resolve: jca-signature }
    asset: { asset_type: algorithm-use, usage_context: signature }
    confidence: high
    examples:
      positive:
        - |
          import java.security.Signature;
          class A { void f() throws Exception { Signature.getInstance("SHA256withRSA"); } }
        - |
          import java.security.Signature;
          class A { void f() throws Exception { Signature.getInstance("Ed25519"); } }
      negative:
        - |
          import java.security.MessageDigest;
          class A { void f() throws Exception { MessageDigest.getInstance("SHA-256"); } }

  - id: JAVA-JCA-KEYGENERATOR
    title: KeyGenerator.getInstance(<symmetric alg>)
    match:
      query: |
        (method_invocation
          object: (identifier) @obj
          name: (identifier) @meth
          arguments: (argument_list (string_literal) @algo)) @call
      where:
        - { capture: obj, equals: KeyGenerator }
        - { capture: meth, equals: getInstance }
    extract:
      algorithm: { from: algo, resolve: string-literal }
    asset: { asset_type: key, usage_context: encryption-at-rest }
    confidence: high
    examples:
      positive:
        - |
          import javax.crypto.KeyGenerator;
          class A { void f() throws Exception { KeyGenerator.getInstance("AES"); } }
        - |
          import javax.crypto.KeyGenerator;
          class A { void f() throws Exception { KeyGenerator.getInstance("DES"); } }
      negative:
        - |
          import java.security.KeyPairGenerator;
          class A { void f() throws Exception { KeyPairGenerator.getInstance("RSA"); } }

  - id: JAVA-JCA-CIPHER-LEGACY-STREAM
    title: Cipher.getInstance("RC4"/"ARCFOUR"/"Blowfish"/"RC2"/"IDEA")
    match:
      query: |
        (method_invocation
          object: (identifier) @obj
          name: (identifier) @meth
          arguments: (argument_list (string_literal) @algo)) @call
      where:
        - { capture: obj, equals: Cipher }
        - { capture: meth, equals: getInstance }
        - { capture: algo, regex: '^"(RC4|ARCFOUR|Blowfish|RC2|IDEA|CAST5)(/|")' }
    extract:
      algorithm: { from: algo, resolve: jca-transformation }
    asset: { asset_type: algorithm-use, usage_context: encryption-at-rest }
    confidence: high
    examples:
      positive:
        - |
          import javax.crypto.Cipher;
          class A { void f() throws Exception { Cipher.getInstance("RC4"); } }
        - |
          import javax.crypto.Cipher;
          class A { void f() throws Exception { Cipher.getInstance("Blowfish/CBC/PKCS5Padding"); } }
      negative:
        - |
          import javax.crypto.Cipher;
          class A { void f() throws Exception { Cipher.getInstance("AES/GCM/NoPadding"); } }

  - id: JAVA-JCA-CIPHER-CHACHA20
    title: Cipher.getInstance("ChaCha20"/"ChaCha20-Poly1305") — quantum-safe, inventoried
    match:
      query: |
        (method_invocation
          object: (identifier) @obj
          name: (identifier) @meth
          arguments: (argument_list (string_literal) @algo)) @call
      where:
        - { capture: obj, equals: Cipher }
        - { capture: meth, equals: getInstance }
        - { capture: algo, regex: '^"ChaCha20' }
    extract:
      algorithm: { from: algo, resolve: jca-transformation }
    asset: { asset_type: algorithm-use, usage_context: encryption-at-rest }
    confidence: high
    examples:
      positive:
        - |
          import javax.crypto.Cipher;
          class A { void f() throws Exception { Cipher.getInstance("ChaCha20-Poly1305"); } }
      negative:
        - |
          import javax.crypto.Cipher;
          class A { void f() throws Exception { Cipher.getInstance("AES/GCM/NoPadding"); } }

  - id: JAVA-JCA-KEYSTORE
    title: KeyStore.getInstance("JKS"/"PKCS12")
    match:
      query: |
        (method_invocation
          object: (identifier) @obj
          name: (identifier) @meth
          arguments: (argument_list (string_literal) @kind)) @call
      where:
        - { capture: obj, equals: KeyStore }
        - { capture: meth, equals: getInstance }
    extract:
      # A keystore is a key CONTAINER, not an algorithm; recording it tells the migration planner
      # there is key material here whose contents the cert/key scanner should enumerate.
      algorithm: { literal: X.509 }
    asset: { asset_type: key, usage_context: tls }
    confidence: medium
    examples:
      positive:
        - |
          import java.security.KeyStore;
          class A { void f() throws Exception { KeyStore.getInstance("JKS"); } }
      negative:
        - |
          import javax.crypto.KeyGenerator;
          class A { void f() throws Exception { KeyGenerator.getInstance("AES"); } }

  - id: JAVA-BC-PQC-MORE
    title: BouncyCastle SLH-DSA / Falcon / LMS parameter selection
    match:
      query: |
        (method_invocation
          object: (identifier) @obj
          name: (identifier) @meth
          arguments: (argument_list (string_literal) @algo)) @call
      where:
        - { capture: obj, in: [KeyPairGenerator, Signature, KeyFactory] }
        - { capture: meth, equals: getInstance }
        - { capture: algo, regex: '^"(SLH-DSA|SPHINCS|FALCON|Falcon|LMS|XMSS)' }
    extract:
      algorithm: { from: algo, resolve: string-literal }
    asset: { asset_type: algorithm-use, usage_context: signature }
    confidence: high
    examples:
      positive:
        - |
          import java.security.KeyPairGenerator;
          class A { void f() throws Exception { KeyPairGenerator.getInstance("SLH-DSA", "BC"); } }
        - |
          import java.security.Signature;
          class A { void f() throws Exception { Signature.getInstance("Falcon", "BC"); } }
      negative:
        - |
          import java.security.KeyPairGenerator;
          class A { void f() throws Exception { KeyPairGenerator.getInstance("RSA"); } }
