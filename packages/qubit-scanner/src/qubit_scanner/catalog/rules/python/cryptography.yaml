schema: qubit-rule/v1
language: python
library:
  name: cryptography
  detect_imports: [cryptography]
rules:
  - id: PY-CRYPTOGRAPHY-RSA-KEYGEN
    title: RSA private-key generation (rsa.generate_private_key)
    match:
      # `value: (_)` not `value: (integer)`. Requiring a literal integer meant a call whose key size
      # came from a variable or config value — `generate_private_key(key_size=key_size)`, extremely
      # common in real code — did not match the query AT ALL and the RSA usage was silently dropped,
      # contradicting doc 01's "nothing is silently dropped" contract. Now the call always matches;
      # `int-literal` extraction simply yields no key_size when the value is not a literal, and the
      # normalizer falls back to the bare RSA family entry, which keeps the Shor-vulnerable verdict.
      query: |
        (call
          function: (attribute object: (identifier) @mod attribute: (identifier) @meth)
          arguments: (argument_list
            (keyword_argument
              name: (identifier) @kw
              value: (_) @size))) @call
      where:
        # The module MUST be checked. Without `@mod == rsa`, this matched ANY
        # `<x>.generate_private_key(key_size=...)` call — so `dsa.generate_private_key(key_size=1024)`
        # was reported as RSA-1024, a false positive that also mislabelled the algorithm family.
        # Requiring the `rsa.` qualifier is how pyca's own documentation writes it; a bare
        # `generate_private_key(...)` after `from ...rsa import generate_private_key` is not matched,
        # which is the right trade — that spelling is ambiguous between rsa/dsa/ec anyway.
        - { capture: mod, equals: rsa }
        - { capture: meth, equals: generate_private_key }
        - { capture: kw, equals: key_size }
    extract:
      algorithm: { literal: RSA }
      key_size: { from: size, resolve: int-literal }
    asset: { asset_type: algorithm-use, usage_context: kex }
    confidence: high
    examples:
      positive:
        - |
          from cryptography.hazmat.primitives.asymmetric import rsa
          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
        - |
          from cryptography.hazmat.primitives.asymmetric import rsa
          def gen(key_size):
              return rsa.generate_private_key(public_exponent=65537, key_size=key_size)
      negative:
        - "from cryptography.hazmat.primitives.asymmetric import x25519"

  - id: PY-CRYPTOGRAPHY-EC-KEYGEN
    title: EC private-key generation (ec.generate_private_key)
    match:
      query: |
        (call
          function: (attribute object: (identifier) @mod attribute: (identifier) @meth)) @call
      where:
        - { capture: mod, equals: ec }
        - { capture: meth, equals: generate_private_key }
    extract:
      algorithm: { literal: ECDSA-P256 }
    asset: { asset_type: algorithm-use, usage_context: signature }
    confidence: medium
    examples:
      positive:
        - |
          from cryptography.hazmat.primitives.asymmetric import ec
          key = ec.generate_private_key(ec.SECP256R1())
      negative:
        - "from cryptography.hazmat.primitives.asymmetric import rsa"

  - id: PY-CRYPTOGRAPHY-ECDH-EXCHANGE
    title: ECDH key agreement (private_key.exchange(ec.ECDH(), peer))
    # `PY-CRYPTOGRAPHY-EC-KEYGEN` above attributes every `ec.generate_private_key(...)` to
    # SIGNING, because a key generation on its own does not say what the key is for. On an ECDH
    # exchange that is the worst class to get wrong: the finding resolves to ML-DSA-65, so the tool
    # answers a key agreement with a signature algorithm, and key agreement is the
    # harvest-now-decrypt-later case that a signature is not.
    #
    # Measured on the MediVault twin, where it cost a correct migration: `negotiate_referral_key`
    # was routed to `py-signature-01`, and the resulting patch broke the agreement between two
    # clinics. Only the `tests` rung caught it. See `qubit-v2/11-implementation-findings.md` §25.
    #
    # This rule reads the call that says what the key is FOR. It is additive: the keygen line still
    # produces its own (signature-labelled) asset, because suppressing that needs dataflow the
    # rule schema deliberately does not have. What changes is that the exchange is now seen at all,
    # and it resolves to `py-ecdh-kex-01` with a hybrid ML-KEM target.
    match:
      query: |
        (call
          function: (attribute attribute: (identifier) @meth)
          arguments: (argument_list
            (call
              function: [(identifier) @alg
                         (attribute object: (identifier) @mod attribute: (identifier) @alg)]))) @call
      where:
        - { capture: meth, equals: exchange }
        - { capture: alg, equals: ECDH }
    extract:
      algorithm: { literal: ECDH }
    # `usage_context: kex` here is belt-and-braces, not load-bearing. `normalize.py`'s
    # `_reconcile_usage_with_algorithm` puts ECDH into `kex` from the algorithm family whatever a
    # rule declares, so mutating this line to `signature` changes nothing observable — verified by
    # doing it. Written out because a reader who mutation-tests this rule will find that mutation
    # surviving and should know it is inert by design rather than untested.
    asset: { asset_type: algorithm-use, usage_context: kex }
    confidence: high
    examples:
      positive:
        - |
          from cryptography.hazmat.primitives.asymmetric import ec
          private_key = ec.generate_private_key(ec.SECP256R1())
          shared = private_key.exchange(ec.ECDH(), peer_public_key)
        - |
          from cryptography.hazmat.primitives.asymmetric.ec import ECDH
          shared = private_key.exchange(ECDH(), peer_public_key)
      negative:
        - "from cryptography.hazmat.primitives.asymmetric import rsa"
        - |
          from cryptography.hazmat.primitives.asymmetric import x25519
          shared = private_key.exchange(peer_public_key)

  - id: PY-CRYPTOGRAPHY-X25519-KEYGEN
    title: X25519 private-key generation
    match:
      # The alternation accepts BOTH the direct-import form (`X25519PrivateKey.generate()`) and the
      # module-qualified form (`x25519.X25519PrivateKey.generate()`). Matching only `(identifier)`
      # missed the qualified form entirely, which is how pyca's own docs write it.
      query: |
        (call
          function: (attribute
            object: [(identifier) @cls (attribute attribute: (identifier) @cls)]
            attribute: (identifier) @meth)) @call
      where:
        - { capture: cls, equals: X25519PrivateKey }
        - { capture: meth, equals: generate }
    extract:
      algorithm: { literal: X25519 }
    asset: { asset_type: algorithm-use, usage_context: kex }
    confidence: high
    examples:
      positive:
        - |
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          key = X25519PrivateKey.generate()
      negative:
        - |
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.generate()

  - id: PY-CRYPTOGRAPHY-ED25519-KEYGEN
    title: Ed25519 private-key generation
    match:
      # See the X25519 rule above: accepts direct-import and module-qualified forms.
      query: |
        (call
          function: (attribute
            object: [(identifier) @cls (attribute attribute: (identifier) @cls)]
            attribute: (identifier) @meth)) @call
      where:
        - { capture: cls, equals: Ed25519PrivateKey }
        - { capture: meth, equals: generate }
    extract:
      algorithm: { literal: Ed25519 }
    asset: { asset_type: algorithm-use, usage_context: signature }
    confidence: high
    examples:
      positive:
        - |
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.generate()
      negative:
        - |
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          key = X25519PrivateKey.generate()

  - id: PY-CRYPTOGRAPHY-HASHES-BROKEN
    title: cryptography hashes.MD5()/hashes.SHA1()
    match:
      query: |
        (call
          function: (attribute object: (identifier) @obj attribute: (identifier) @alg)) @call
      where:
        - { capture: obj, equals: hashes }
        - { capture: alg, in: [MD5, SHA1] }
    extract:
      algorithm: { from: alg, resolve: capture-text }
    asset: { asset_type: algorithm-use, usage_context: hash }
    confidence: high
    examples:
      positive:
        - |
          from cryptography.hazmat.primitives import hashes
          digest = hashes.Hash(hashes.SHA1())
        - |
          from cryptography.hazmat.primitives import hashes
          digest = hashes.Hash(hashes.MD5())
      negative:
        - |
          from cryptography.hazmat.primitives import hashes
          digest = hashes.Hash(hashes.SHA256())
