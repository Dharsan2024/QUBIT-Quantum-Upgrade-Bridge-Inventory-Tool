# TypeScript parity for the identically-named javascript pack (separate tree-sitter grammar,
# separate rule set — a .ts file matches none of the JS rules).
schema: qubit-rule/v1
language: typescript
# Same queries also compiled against the tsx grammar:
# tree-sitter treats TSX as its own language, and React components are
  # where browser-side crypto usually lives.
additional_languages: [tsx]
library:
  name: node:crypto / WebCrypto
  detect_imports: []
rules:
  # Remaining Node/browser crypto entry points. Together with node_crypto.yaml these cover the
  # surface an application realistically touches; previously only createHash/createCipheriv/
  # createHmac/generateKeyPairSync were detected.
  - id: TS-NODE-CREATECIPHER-LEGACY
    title: crypto.createCipher / createDecipher (deprecated, key derived without a salt)
    match:
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @obj
            property: (property_identifier) @meth)
          arguments: (arguments (string (string_fragment) @alg) (_))) @call
      where:
        - { capture: obj, equals: crypto }
        - { capture: meth, in: [createCipher, createDecipher] }
    extract:
      algorithm: { from: alg, resolve: capture-text }
    asset: { asset_type: algorithm-use, usage_context: encryption-at-rest }
    confidence: high
    examples:
      positive:
        - |
          import * as crypto from 'crypto';
          const c = crypto.createCipher('aes-128-cbc', password);
      negative:
        - |
          import * as crypto from 'crypto';
          const c = crypto.createCipheriv('aes-256-gcm', key, iv);

  - id: TS-NODE-PBKDF2
    title: crypto.pbkdf2 / pbkdf2Sync
    match:
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @obj
            property: (property_identifier) @meth)) @call
      where:
        - { capture: obj, equals: crypto }
        - { capture: meth, in: [pbkdf2, pbkdf2Sync] }
    extract:
      algorithm: { literal: PBKDF2 }
    asset: { asset_type: algorithm-use, usage_context: password }
    confidence: high
    examples:
      positive:
        - |
          import * as crypto from 'crypto';
          const k = crypto.pbkdf2Sync(pw, salt, 100000, 32, 'sha256');
      negative:
        - |
          import * as crypto from 'crypto';
          const k = crypto.scryptSync(pw, salt, 32);

  - id: TS-NODE-SCRYPT
    title: crypto.scrypt / scryptSync
    match:
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @obj
            property: (property_identifier) @meth)) @call
      where:
        - { capture: obj, equals: crypto }
        - { capture: meth, in: [scrypt, scryptSync] }
    extract:
      algorithm: { literal: scrypt }
    asset: { asset_type: algorithm-use, usage_context: password }
    confidence: high
    examples:
      positive:
        - |
          import * as crypto from 'crypto';
          const k = crypto.scryptSync(pw, salt, 32);
      negative:
        - |
          import * as crypto from 'crypto';
          const k = crypto.pbkdf2Sync(pw, salt, 1000, 32, 'sha256');

  - id: TS-NODE-HKDF
    title: crypto.hkdf / hkdfSync
    match:
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @obj
            property: (property_identifier) @meth)) @call
      where:
        - { capture: obj, equals: crypto }
        - { capture: meth, in: [hkdf, hkdfSync] }
    extract:
      algorithm: { literal: HKDF }
    asset: { asset_type: algorithm-use, usage_context: kex }
    confidence: high
    examples:
      positive:
        - |
          import * as crypto from 'crypto';
          const k = crypto.hkdfSync('sha256', ikm, salt, info, 32);
      negative:
        - |
          import * as crypto from 'crypto';
          const k = crypto.scryptSync(pw, salt, 32);

  - id: TS-NODE-CREATESIGN
    title: crypto.createSign(<digest>) / createVerify(<digest>)
    match:
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @obj
            property: (property_identifier) @meth)
          arguments: (arguments (string (string_fragment) @alg))) @call
      where:
        - { capture: obj, equals: crypto }
        - { capture: meth, in: [createSign, createVerify] }
    extract:
      # The argument names the DIGEST (e.g. 'RSA-SHA256', 'sha256'); the signing key type is only
      # known at .sign() time, so the digest is what can be honestly reported here.
      algorithm: { from: alg, resolve: capture-text }
    asset: { asset_type: algorithm-use, usage_context: signature }
    confidence: medium
    examples:
      positive:
        - |
          import * as crypto from 'crypto';
          const s = crypto.createSign('sha256');
      negative:
        - |
          import * as crypto from 'crypto';
          const h = crypto.createHash('sha256');

  - id: TS-NODE-CREATEECDH
    title: crypto.createECDH(<curve>)
    match:
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @obj
            property: (property_identifier) @meth)
          arguments: (arguments (string (string_fragment) @alg))) @call
      where:
        - { capture: obj, equals: crypto }
        - { capture: meth, equals: createECDH }
    extract:
      algorithm: { from: alg, resolve: capture-text }
    asset: { asset_type: algorithm-use, usage_context: kex }
    confidence: high
    examples:
      positive:
        - |
          import * as crypto from 'crypto';
          const ec = crypto.createECDH('secp256k1');
        - |
          import * as crypto from 'crypto';
          const ec = crypto.createECDH('prime256v1');
      negative:
        - |
          import * as crypto from 'crypto';
          const dh = crypto.createDiffieHellman(2048);

  - id: TS-NODE-CREATEDH
    title: crypto.createDiffieHellman(<bits>)
    match:
      query: |
        (call_expression
          function: (member_expression
            object: (identifier) @obj
            property: (property_identifier) @meth)
          arguments: (arguments (number) @size)) @call
      where:
        - { capture: obj, equals: crypto }
        - { capture: meth, equals: createDiffieHellman }
    extract:
      algorithm: { literal: DH }
      key_size: { from: size, resolve: int-literal }
    asset: { asset_type: algorithm-use, usage_context: kex }
    confidence: high
    examples:
      positive:
        - |
          import * as crypto from 'crypto';
          const dh = crypto.createDiffieHellman(2048);
      negative:
        - |
          import * as crypto from 'crypto';
          const ec = crypto.createECDH('prime256v1');

  # --- WebCrypto (browser + Node's webcrypto). `subtle.digest('SHA-1', ...)` and
  # `subtle.generateKey({name:'RSASSA-PKCS1-v1_5'...})` are how modern front-end code does crypto. ---
  - id: TS-WEBCRYPTO-DIGEST
    title: crypto.subtle.digest(<hash>, data)
    match:
      query: |
        (call_expression
          function: (member_expression
            object: (member_expression property: (property_identifier) @sub)
            property: (property_identifier) @meth)
          arguments: (arguments (string (string_fragment) @alg) (_))) @call
      where:
        - { capture: sub, equals: subtle }
        - { capture: meth, equals: digest }
    extract:
      algorithm: { from: alg, resolve: capture-text }
    asset: { asset_type: algorithm-use, usage_context: hash }
    confidence: high
    examples:
      positive:
        - |
          async function f(data) {
            return await crypto.subtle.digest('SHA-1', data);
          }
      negative:
        - |
          async function f(data) {
            return await crypto.subtle.exportKey('raw', key);
          }

  - id: TS-WEBCRYPTO-GENERATEKEY
    title: "crypto.subtle.generateKey({ name: <alg> }, ...)"
    match:
      query: |
        (call_expression
          function: (member_expression
            object: (member_expression property: (property_identifier) @sub)
            property: (property_identifier) @meth)
          arguments: (arguments
            (object (pair key: (property_identifier) @key value: (string (string_fragment) @alg))))) @call
      where:
        - { capture: sub, equals: subtle }
        - { capture: meth, in: [generateKey, importKey, deriveKey] }
        - { capture: key, equals: name }
    extract:
      algorithm: { from: alg, resolve: capture-text }
    asset: { asset_type: algorithm-use, usage_context: unknown }
    confidence: high
    examples:
      positive:
        - |
          async function f() {
            return await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign']);
          }
      negative:
        - |
          async function f(data) {
            return await crypto.subtle.digest('SHA-256', data);
          }
