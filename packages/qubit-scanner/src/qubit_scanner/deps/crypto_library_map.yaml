  # --- crates.io (Rust) ---
  # RustCrypto publishes one crate per primitive, so the crate name IS the algorithm in most
  # cases; the wrapper crates (ring, openssl, rustls) are the ones that need a real list.
  - package: ring
    ecosystem: cargo
    algorithms:
      - { algorithm: SHA-256, usage_context: hash }
      - { algorithm: AES-256, usage_context: encryption-at-rest }
      - { algorithm: Ed25519, usage_context: signature }
      - { algorithm: ECDSA-P256, usage_context: signature }
      - { algorithm: X25519, usage_context: kex }
      - { algorithm: HMAC, usage_context: mac }
      # ring keeps SHA-1 available under a name that says not to use it.
      - { algorithm: SHA-1, usage_context: hash }

  - package: openssl
    ecosystem: cargo
    algorithms:
      - { algorithm: RSA, usage_context: kex }
      - { algorithm: ECDSA, usage_context: signature }
      - { algorithm: AES-256, usage_context: encryption-at-rest }
      - { algorithm: SHA-256, usage_context: hash }

  - package: rustls
    ecosystem: cargo
    algorithms:
      - { algorithm: TLSv1.3, usage_context: tls }
      - { algorithm: TLSv1.2, usage_context: tls }
      - { algorithm: X25519, usage_context: kex }
      - { algorithm: ECDSA-P256, usage_context: signature }

  - package: rustls-post-quantum
    ecosystem: cargo
    algorithms:
      # This crate exists solely to add the hybrid group to rustls.
      - { algorithm: X25519MLKEM768, usage_context: kex }
      - { algorithm: ML-KEM-768, usage_context: kex }

  - package: ml-kem
    ecosystem: cargo
    algorithms:
      - { algorithm: ML-KEM-512, usage_context: kex }
      - { algorithm: ML-KEM-768, usage_context: kex }
      - { algorithm: ML-KEM-1024, usage_context: kex }

  - package: ml-dsa
    ecosystem: cargo
    algorithms:
      - { algorithm: ML-DSA-44, usage_context: signature }
      - { algorithm: ML-DSA-65, usage_context: signature }
      - { algorithm: ML-DSA-87, usage_context: signature }

  - package: md-5
    ecosystem: cargo
    algorithms:
      - { algorithm: MD5, usage_context: hash }

  - package: sha1
    ecosystem: cargo
    algorithms:
      - { algorithm: SHA-1, usage_context: hash }

  - package: sha2
    ecosystem: cargo
    algorithms:
      - { algorithm: SHA-256, usage_context: hash }
      - { algorithm: SHA-512, usage_context: hash }

  - package: des
    ecosystem: cargo
    algorithms:
      - { algorithm: DES, usage_context: encryption-at-rest }
      - { algorithm: 3DES, usage_context: encryption-at-rest }

  - package: aes
    ecosystem: cargo
    algorithms:
      - { algorithm: AES-128, usage_context: encryption-at-rest }
      - { algorithm: AES-256, usage_context: encryption-at-rest }

  - package: rc4
    ecosystem: cargo
    algorithms:
      - { algorithm: RC4, usage_context: encryption-at-rest }

  - package: blowfish
    ecosystem: cargo
    algorithms:
      - { algorithm: Blowfish, usage_context: encryption-at-rest }

  - package: rsa
    ecosystem: cargo
    algorithms:
      - { algorithm: RSA, usage_context: kex }

  - package: ed25519-dalek
    ecosystem: cargo
    algorithms:
      - { algorithm: Ed25519, usage_context: signature }

  - package: x25519-dalek
    ecosystem: cargo
    algorithms:
      - { algorithm: X25519, usage_context: kex }

  - package: p256
    ecosystem: cargo
    algorithms:
      - { algorithm: ECDSA-P256, usage_context: signature }
      - { algorithm: ECDH-P256, usage_context: kex }

  - package: chacha20poly1305
