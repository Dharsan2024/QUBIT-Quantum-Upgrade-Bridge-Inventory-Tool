      - { algorithm: 3DES, usage_context: encryption-at-rest }
      - { algorithm: Ed25519, usage_context: signature }
      # BouncyCastle C# 2.x carries the NIST PQC algorithms.
      - { algorithm: ML-KEM-768, usage_context: kex, min_version: "2.0" }
      - { algorithm: ML-DSA-65, usage_context: signature, min_version: "2.0" }

