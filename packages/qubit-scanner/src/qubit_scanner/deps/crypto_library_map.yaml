  # --- SwiftPM ---
  # Names are the repository's last path component, which is how SwiftPM identifies a package.
  - package: swift-crypto
    ecosystem: swiftpm
    algorithms:
      - { algorithm: SHA-256, usage_context: hash }
      - { algorithm: AES-256, usage_context: encryption-at-rest }
      - { algorithm: ECDSA-P256, usage_context: signature }
      - { algorithm: Ed25519, usage_context: signature }
      - { algorithm: X25519, usage_context: kex }
      - { algorithm: ChaCha20, usage_context: encryption-at-rest }
      # Apple keeps MD5 and SHA-1 in an `Insecure` namespace rather than removing them.
      - { algorithm: MD5, usage_context: hash }
      - { algorithm: SHA-1, usage_context: hash }

  - package: cryptoswift
    ecosystem: swiftpm
    algorithms:
      - { algorithm: MD5, usage_context: hash }
